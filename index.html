<style>
:root{
  --bg:#f2f2f7;--card:#ffffff;--ink:#0b0b0f;--mut:#8a8a8f;--line:#e4e4ea;--accent:#2d6ae3;--accent-soft:#e8f0fe;
  --pill:#ffffff;--pill-on:#e8e8ee;--dark-btn:#000000;--dark-btn-ink:#ffffff;--bar:rgba(246,246,249,.86);--shadow:0 6px 24px rgba(0,0,0,.14);--bad:#d33a2c;
  --ui:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Noto Sans','Noto Sans Devanagari','Noto Sans Arabic','Noto Sans CJK SC',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000;--card:#1c1c1e;--ink:#f5f5f7;--mut:#8e8e93;--line:#38383a;--accent:#6ea0ff;--accent-soft:#1b2944;
  --pill:#1c1c1e;--pill-on:#2c2c2e;--dark-btn:#ffffff;--dark-btn-ink:#000000;--bar:rgba(28,28,30,.86);--shadow:0 6px 24px rgba(0,0,0,.6);--bad:#ff6b5e;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000;--card:#1c1c1e;--ink:#f5f5f7;--mut:#8e8e93;--line:#38383a;--accent:#6ea0ff;--accent-soft:#1b2944;
  --pill:#1c1c1e;--pill-on:#2c2c2e;--dark-btn:#ffffff;--dark-btn-ink:#000000;--bar:rgba(28,28,30,.86);--shadow:0 6px 24px rgba(0,0,0,.6);--bad:#ff6b5e;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.35 var(--ui);overflow:hidden;-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- library screen ---------- */
#home{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.wrapin{max-width:1100px;margin:0 auto}
.nav{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between;padding:6px 0 4px}
.tabs{display:flex;background:var(--pill);border-radius:999px;padding:4px;box-shadow:0 2px 14px rgba(0,0,0,.07);margin:0 auto 0 0;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
.font-slider{padding:12px 16px 14px}.font-slider .font-label{display:flex;align-items:center;justify-content:space-between;margin:0 0 8px;font-size:15px;color:var(--mut)}.font-slider output{font-size:18px;color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}.font-slider input[type=range]{width:100%;accent-color:var(--accent);height:28px;cursor:pointer}
.tabs button{height:44px;padding:0 22px;border-radius:999px;font-weight:500;font-size:18px;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--pill-on);color:var(--accent);font-weight:600}
.right{display:flex;gap:12px;align-items:center;flex:1 1 280px;justify-content:flex-end}
.addpill{display:flex;align-items:center;gap:8px;background:var(--pill);border-radius:999px;padding:4px;box-shadow:0 2px 14px rgba(0,0,0,.07)}
.addpill .n{background:var(--pill-on);color:var(--mut);border-radius:999px;padding:5px 12px;font-weight:600;font-size:15px}
.plus{width:44px;height:44px;border-radius:50%;background:var(--dark-btn);color:var(--dark-btn-ink);display:grid;place-items:center}
.plus svg{width:24px;height:24px;stroke-width:2.4}
.search{flex:1 1 180px;max-width:420px;display:flex;align-items:center;gap:10px;background:var(--pill);border-radius:999px;padding:0 18px;height:52px;box-shadow:0 2px 14px rgba(0,0,0,.07);color:var(--mut)}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;-webkit-user-select:text;user-select:text;font-size:18px;color:var(--ink)}
.search input::placeholder{color:var(--mut)}
h1{font-size:40px;line-height:1.1;margin:34px 4px 18px;font-weight:800;letter-spacing:-.02em}
.card{background:var(--card);border-radius:28px;overflow:hidden}
.row{display:flex;align-items:center;gap:18px;width:100%;text-align:left;padding:16px 22px 16px 22px;position:relative}
.row:active{background:var(--pill-on)}
.row+.row::before{content:"";position:absolute;top:0;left:96px;right:22px;border-top:1px solid var(--line)}
.fi{width:56px;height:56px;border-radius:15px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.fi svg{width:28px;height:28px}
.tx{flex:1;min-width:0}
.nm{font-size:21px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.sz{color:var(--mut);font-size:16px}
svg.i.star{color:#f4a600;width:20px;height:20px;fill:#f4a600;margin-right:2px}
.chev{color:var(--mut);opacity:.7;width:20px;height:20px}
.empty{padding:56px 24px;text-align:center;color:var(--mut)}
.empty b{display:block;color:var(--ink);font-size:22px;margin-bottom:6px}
.empty .big{margin-top:18px;display:inline-flex;gap:8px;align-items:center;background:var(--dark-btn);color:var(--dark-btn-ink);height:48px;padding:0 24px;border-radius:999px;font-weight:600}
.tip{margin:18px 6px;color:var(--mut);font-size:15px;display:flex;gap:10px;align-items:flex-start}
.tip button{margin-left:auto;color:var(--accent);font-weight:600}
.fi.dir{background:color-mix(in srgb,#f4a600 18%,transparent);color:#e39a00}
.crumb{display:inline-flex;align-items:center;gap:2px;height:40px;margin:2px 0 8px 2px;color:var(--accent);font-weight:600;font-size:19px}
.crumb svg{width:22px;height:22px;transform:scaleX(-1)}
.nm,.sz{max-width:100%}
.sz.p{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* progress badges + filter chips */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 2px 14px}
.chips .chip{height:38px;padding:0 16px;border-radius:999px;background:var(--pill);box-shadow:0 2px 10px rgba(0,0,0,.06);font-weight:500;font-size:16px;white-space:nowrap}
.chips .chip[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:600}
.row.rdone{background:color-mix(in srgb,#34c759 13%,var(--card))}
.row.rdone:active{background:var(--pill-on)}
.fi.ok{background:color-mix(in srgb,#34c759 22%,transparent);color:#1f9d4a}
.pg{display:flex;flex-direction:column;align-items:flex-end;flex:none;line-height:1.15;margin-left:6px;text-align:right}
.pg b{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.pg small{font-size:13px;color:var(--mut)}
.pg.done b{color:#1f9d4a}.pg.prog b{color:#e39a00}
/* settings */
.sec{margin:0 0 22px}
.sec h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:0 0 8px 18px;font-weight:600}
.set{display:flex;align-items:center;gap:14px;padding:15px 20px;min-height:56px;width:100%;text-align:left}
.set+.set{border-top:1px solid var(--line)}
.set .lb{flex:1}.set .lb small{display:block;color:var(--mut);font-size:14px;margin-top:2px}
.seg{display:inline-flex;background:var(--pill-on);border-radius:10px;padding:3px}
.seg button{padding:6px 14px;border-radius:8px;font-size:15px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.18)}
.sw{position:relative;width:52px;height:32px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;width:100%;height:100%;cursor:pointer}
.sw i{position:absolute;inset:0;background:var(--pill-on);border-radius:99px;transition:background .18s}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.3);transition:transform .18s}
.sw input:checked+i{background:#34c759}
.sw input:checked+i::after{transform:translateX(20px)}
.sw input:focus-visible+i{outline:3px solid var(--accent);outline-offset:2px}
.danger{color:var(--bad);font-weight:600}
select.sel{background:var(--pill-on);border:0;border-radius:10px;padding:8px 12px;font-size:16px;color:var(--ink)}

/* ---------- reader ---------- */
#reader{position:fixed;inset:0;z-index:50;background:var(--bg)}
#reader[hidden]{display:none}
#rbar{position:absolute;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;gap:12px;height:calc(64px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px));background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border-bottom:1px solid var(--line);transition:transform .22s}
#rbar .t{flex:1;text-align:center;font-weight:700;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.circ{width:46px;height:46px;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:0 2px 12px rgba(0,0,0,.14);flex:none}
#rframe{position:absolute;left:0;right:0;bottom:0;top:calc(64px + env(safe-area-inset-top,0px));background:#fff;transition:top .22s;overflow:hidden}
#rframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
#reader.hide-bar #rbar{transform:translateY(-110%)}
#reader.hide-bar #rframe{top:0}
#reader.hide-bar.peek #rbar{transform:none}
.fl{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));z-index:6;display:none;opacity:.55}
.fl .circ{width:40px;height:40px}
#flL{left:max(10px,env(safe-area-inset-left,0px))}#flR{right:max(10px,env(safe-area-inset-right,0px))}
#reader[data-mode="focus"] .fl{display:block}
#reader.peek .fl{display:none!important}
#grab{position:absolute;top:0;left:50%;transform:translateX(-50%);width:160px;height:26px;z-index:6;display:none}
#grab::after{content:"";position:absolute;left:50%;top:7px;width:52px;height:5px;margin-left:-26px;border-radius:3px;background:rgba(120,120,130,.55)}
#reader[data-mode="full"] #grab{display:block}
#reader.peek #grab{display:none}

/* menus */
#layer{position:fixed;inset:0;z-index:70;cursor:pointer}.menu{cursor:default}
#layer[hidden]{display:none}

function hashKey(title,qs){let h=0;const sig=title+'|'+qs.length+'|'+(qs[0]?String(qs[0].q).slice(0,60):'');for(let i=0;i<sig.length;i++)h=(h*31+sig.charCodeAt(i))|0;return 'gt_'+h}
function extractCfg(t){const m=/\bRAW_CFG\s*=\s*/.exec(t);if(!m)return null;const i=m.index+m[0].length;if(t[i]!=='{')return null;
  let d=0,str=false,esc=false,j=i;
  for(;j<t.length;j++){const c=t[j];
    if(str){if(esc)esc=false;else if(c==='\\')esc=true;else if(c==='"')str=false}
    else if(c==='"')str=true;else if(c==='{')d++;else if(c==='}'){d--;if(!d){j++;break}}}
  try{return JSON.parse(t.slice(i,j))}catch(e){return null}}
function buildMeta(cfg){const tests=Array.isArray(cfg.tests)?cfg.tests:[cfg];
  return tests.filter(c=>c&&Array.isArray(c.questions)).map(c=>({key:hashKey(c.title,c.questions),n:c.questions.length,a:c.questions.map(q=>q.a),mc:c.mc==null?4:+c.mc,mw:c.mw==null?1:+c.mw}))}
const PAT={NEET_PG:{label:'NEET PG',mc:4,mw:1},INICET:{label:'INICET',mc:1,mw:0.33}};
const patOf=key=>{const p=LS.get('pat.'+key,null);return p&&PAT[p]?PAT[p]:null};
const r2=x=>Math.round(x*100)/100;
function one(t){let st=null;try{st=JSON.parse(localStorage.getItem(t.key))}catch(e){}
  if(!st||!st.phase||st.phase==='intro')return{k:'new'};
  const ans=st.ans||{};let c=0,w=0,at=0;
  for(const q in ans){at++;const A=t.a[q];if(A==null||A<0)continue;if(ans[q]===A)c++;else w++}
  const P=patOf(t.key),mc=P?P.mc:t.mc,mw=P?P.mw:t.mw;const max=t.a.filter(x=>x!=null&&x>=0).length*mc,score=r2(c*mc-w*mw);
  return{k:(st.phase==='done'||st.phase==='review')?'done':'prog',score,max,at,n:t.n,pct:max?Math.round(score/max*100):0}}
function prog(f){const m=f.meta;if(!m||!m.length)return{k:'new'};
  const r=m.map(one);

  const d=r.filter(x=>x.k==='done'),p=r.filter(x=>x.k==='prog');
  if(!d.length&&!p.length)return{k:'new'};
  if(d.length===r.length)return{k:'done',multi:1,done:d.length,total:r.length,pct:Math.round(d.reduce((s,x)=>s+x.pct,0)/d.length)};
  return{k:'prog',multi:1,done:d.length,total:r.length}}
function badge(g){

  if(g.k==='prog')return g.multi?'<span class="pg prog"><b>'+g.done+'/'+g.total+'</b><small>tests done</small></span>':'<span class="pg prog"><b>'+g.at+'/'+g.n+'</b><small>In progress</small></span>';
  return''}

function dirDone(path){let n=0;for(const f of S.files)if(inPath(f,path)&&prog(f).k==='done')n++;return n?' · '+n+' done':''}
const dropMeta=id=>{try{localStorage.removeItem('hr.m.'+id)}catch(e){}};
let scanning=false;
async function scanAll(){if(scanning)return;scanning=true;let n=0;
  try{for(const f of S.files.slice()){if(f.meta!==undefined)continue;

function flatList(){const q=S.q.trim().toLowerCase();return S.files.filter(f=>(S.tab!=='fav'||f.fav)&&(S.filt==='all'||prog(f).k===S.filt)&&(!q||(clean(f.name)+' '+f.name+' '+relOf(f).map(clean).join(' ')).toLowerCase().includes(q))).sort((a,b)=>nat(clean(a.name),clean(b.name)))}
function browse(){const p=S.path,d=new Map(),files=[];

const fileRow=(f,sub)=>{const g=prog(f),ok=g.k==='done',label=clean(f.name);return '<div class="row'+(ok?' rdone':'')+'" data-id="'+esc(f.id)+'"><button class="row-open" aria-label="Open '+esc(label)+'"><span class="fi'+(ok?' ok':'')+'">'+ico(ok?'check':'doc')+'</span><span class="tx"><span class="nm">'+esc(label)+'</span><span class="sz p">'+esc(sub)+'</span></span>'+badge(g)+(f.fav?ico('star','star'):'')+ico('chev','chev')+'</button>'+rowOptions(label)+'</div>'};

/* Returns the test HTML with every question given an "s" it can trust (config JSON round-trip,
   same serialization applyPattern uses). Files whose own subjects are already meaningful come
   back byte-identical.
   Two rules drive it, matching what a reader expects from each kind of test:
   • Subject test (title/file names one subject, e.g. "Radiology – Inicet May 2023"): every MCQ
     of that test belongs to that subject, whatever the source's "s" said.
   • Grand test (no single subject in the name): each MCQ is classified on its own content.
     A single subject repeated across almost the whole paper — the template's "Medicine" dump —
     is not trusted as classification and is re-scored from the question, options and explanation. */
function applySubjects(text,fileName){
  try{
    const sp=cfgSpan(text);if(!sp)return text;
    let cfg;try{cfg=JSON.parse(text.slice(sp[0],sp[1]))}catch(e){return text}
    const list=Array.isArray(cfg&&cfg.tests)?cfg.tests:[cfg];
    if(!list.some(c=>c&&Array.isArray(c.questions)))return text;
    const tLabels=subjTemplateList(text),labelMap=subjLabelMap(tLabels),unknown={};
    const multi=list.length>1;let changed=false;
    list.forEach(c=>{
      if(!c||!Array.isArray(c.questions))return;
      const qs=c.questions,title=c.title||c.brand||'';
      let forced=subjForced(title,fileName,multi);
      /* A custom module knows which subjects it contains: one means a subject test, several
         mean a mixed module even if its chosen name happens to contain a subject word. */
      if(Array.isArray(c.reviewSubjects)&&c.reviewSubjects.length){
        const names=[];
        c.reviewSubjects.forEach(r=>{const n=subjNorm(r)||subjFromTitle(r);if(n&&names.indexOf(n)<0)names.push(n)});
        if(names.length===1)forced=names[0];else if(names.length>1)forced=null;
      }
      /* What the file itself claims, before we touch anything. */
      const own=qs.map(q=>subjNorm(q&&q.s));
      const counts={};let valid=0,max=0;
      own.forEach(s=>{if(!s)return;valid++;counts[s]=(counts[s]||0)+1;if(counts[s]>max)max=counts[s]});
      /* Only a grand paper can be a "dump": a named or small subject test is allowed to have
         every MCQ in one subject. */
      const grand=subjGrandName(fileName,title)||qs.length>=150;
      const dumped=!forced&&grand&&valid>=6&&max/valid>=0.9;
      qs.forEach((q,i)=>{
        if(!q||typeof q!=='object')return;
        const cur=own[i];
        let sub;
        if(forced)sub=forced;                       /* subject test: one bucket for all MCQs */
        else if(cur&&!dumped)sub=cur;               /* grand test keeps real source subjects */
        else sub=subjClassify(q,dumped?null:cur);   /* classify, or trust the source's subject */
        if(!sub)sub='Unclassified';
        const label=(sub==='Unclassified')?sub:(labelMap[sub]||sub);
        if(tLabels&&tLabels.indexOf(label)<0)unknown[label]=1;
        if(q.s!==label){q.s=label;changed=true}
      })
    });
    if(!changed)return text;
    let out=text.slice(0,sp[0])+JSON.stringify(cfg).replace(/</g,'\\u003c')+text.slice(sp[1]);
    /* Every subject actually used — including the honest Unclassified group and any name this
       template's own list lacks — needs a place in SUBJECT_LIST (the dropdown, score cards and
       the per-question picker all read it). */
    const add=Object.keys(unknown);
    if(add.length){
      const m=/((?:const|let|var)\s+SUBJECT_LIST\s*=\s*\[[^\]]*)\]/.exec(out);
      if(m){
        const have=subjTemplateList(out)||[];
        const put=add.filter(l=>have.indexOf(l)<0);
        if(put.length)out=out.slice(0,m.index+m[1].length)+put.map(l=>",'"+String(l).replace(/\\/g,'\\\\').replace(/'/g,"\\'")+"'").join('')+']'+out.slice(m.index+m[0].length);
      }
    }
    return out
  }catch(e){return text}}

const FONTS=[60,70,80,90,100,110,125,150,175,200,250];
/* The reference question layout, forced on every test page (library tests, custom modules and
   searched MCQs). <main> is the scrollable area and holds the question AND the options: the

/* Marrow behaviour on every render: options join the scrollable question area; the bottom bar
   shows ☰ (all questions), ☆ (mark for review), ? (guess), PREV and SKIP/NEXT/SUBMIT; the last
   question of the test turns Next into SUBMIT (confirmation) and a section's last question
   advances the section. Review cards get the cyan "Q MCQID" pill and PREV/NEXT/DONE labels. */
function marrowFix(){
  var mwLast='',mwScroll=0;
  /* Option boxes keep one exact height (48px) with the same gap between them whatever the text
     length: text that would not fit steps its font size down until it does (floor 11px). Only
     text that still cannot fit at the floor grows its box, so every option stays readable. */
  function fitOpts(r){
    if(r.classList.contains('answered'))return;
    var list=r.querySelectorAll('.opts .opt');
    for(var i=0;i<list.length;i++){
      var o=list[i];
      o.style.removeProperty('font-size');
      o.style.removeProperty('height');
      var fs=parseFloat(getComputedStyle(o).fontSize)||15,guard=0;
      while((o.scrollHeight>o.clientHeight+1||o.scrollWidth>o.clientWidth+1)&&guard++<40&&fs>11){
        fs-=0.5;
        o.style.setProperty('font-size',fs+'px','important');
      }
      if(o.scrollHeight>o.clientHeight+1)o.style.setProperty('height','auto','important');
    }
  }
  /* The template hard-codes "19 MBBS Subjects" everywhere and lists all 19 subjects in the
     review dropdown even when the test contains none of them. Show only what the test has. */
  function mwSubjUI(r){
    try{
      var f=r.querySelector('#fsub');
      if(f&&f.options&&f.options.length){
        var heal=false;
        for(var i=f.options.length-1;i>=0;i--){
          var o=f.options[i];
          if(o.value==='all'){
            if(o.textContent.indexOf('All 19 MBBS Subjects')>=0)o.textContent=o.textContent.replace('All 19 MBBS Subjects','All subjects');
          }else if(/\(\s*0\s*\)\s*$/.test(o.textContent||'')){
            /* a saved filter can point at a subject the test lost after re-classification —
               drop the empty option and fall back to All subjects */
            if(o.selected){heal=true;try{f.value='all'}catch(e){}}
            if(f.removeChild)f.removeChild(o);
          }
        }
        /* Re-render after this pass is finished, never from inside it: dispatching change while
           the review page is being rewritten used to leave the dropdown (and the question card)
           on a stale subject. */
        if(heal&&!f.getAttribute('data-hr-heal')){
          f.setAttribute('data-hr-heal','1');
          (function(sel){setTimeout(function(){try{var ev=null;try{ev=new Event('change')}catch(e){}
            if(ev&&sel.dispatchEvent)sel.dispatchEvent(ev)}catch(e){}},0)})(f);
        }
      }
      var spans=r.querySelectorAll('h2.gh span');
      for(var j=0;j<spans.length;j++){
        var t=spans[j].textContent||'';
        if(t.indexOf('19 MBBS Subjects')>=0){
          var cards=r.querySelectorAll('.sj'),n=0;
          for(var c=0;c<cards.length;c++){
            var h=cards[c].querySelector('h3');
            if(!/^\s*Unclassified\b/.test(h?h.textContent:''))n++;
          }
          spans[j].textContent=t.replace('19 MBBS Subjects',n+(n===1?' subject':' subjects'));
        }
      }
      var ps=r.querySelectorAll('.page p');
      for(var k=0;k<ps.length;k++){
        var pt=ps[k].textContent||'';
        if(pt.indexOf('19 MBBS subjects')>=0)ps[k].textContent=pt.replace(/\s*·\s*19 MBBS subjects/,'');
      }
    }catch(e){}
  }
  function fix(){
    var r=document.getElementById('root');
    if(!r)return;
    var main=r.querySelector('main');
    var nx=document.getElementById('nx');
    if(nx&&main){
      r.classList.add('mw-exam');
      var opts=r.querySelector('.opts');
      if(opts&&opts.parentElement!==main)main.appendChild(opts);
      /* the all-questions button joins the button row, so every control shares one baseline */
      var nav=r.querySelector('.nav'),plm=document.getElementById('pl');
      if(plm&&nav&&plm.parentElement!==nav)nav.insertBefore(plm,nav.firstChild);
      var qb=r.querySelector('.qbadge');
      if(qb){
        var m=/Q\s*(\d+)\s*of\s*(\d+)/.exec(qb.textContent);
        if(m&&qb.textContent!==m[1]+' of '+m[2])qb.textContent=m[1]+' of '+m[2];
      }
      var pill=r.querySelector('.sec-pill'),sm=/Section\s+(\d+)\s*\/\s*(\d+)/.exec(pill?pill.textContent:'');
      if(sm)r.classList.remove('mw-single');else r.classList.add('mw-single');
      var lastSection=!sm||+sm[1]>=+sm[2],cnt=/(\d+)\s*of\s*(\d+)/.exec(qb?qb.textContent:''),lastQ=!!(cnt&&+cnt[1]>=+cnt[2]);
      /* Section programming stays as in the original test files: inside a section Next behaves
         normally and is simply disabled at that section's last question. The End-section button
         stays out of the bar and appears at exactly that boundary — and only in multi-section
         tests, never for the final section, whose last question says SUBMIT instead. */
      var en=r.querySelector('#en');
      if(en)en.classList.toggle('mw-show',!!sm&&!lastSection&&lastQ);
      if(lastQ&&lastSection){
        nx.removeAttribute('disabled');
        if(!nx.getAttribute('data-mw')){
          nx.setAttribute('data-mw','1');
          nx.addEventListener('click',function(){var t=document.getElementById('x');if(t)t.click()});
        }
      }
      var lbl=(lastQ&&lastSection)?'SUBMIT':(r.querySelector('.opt.sel')?'NEXT':'SKIP');
      if(nx.textContent!==lbl)nx.textContent=lbl;
      nx.setAttribute('aria-label',lbl==='SUBMIT'?'Submit test':(lbl==='SKIP'?'Skip to the next question':'Next question'));
    }else{
      r.classList.remove('mw-exam');
    }
    var rn=document.getElementById('rn');
    if(rn)r.classList.add('mw-review');else r.classList.remove('mw-review');
    var card=r.querySelector('.card.rv');
    if(card){
      /* skipped-question note: "You skipped this question" below the options (review only) */
      if(card.querySelector('.qn-row .tag.un')&&!card.querySelector('.mw-skipnote')){
        var exN=card.querySelector('.ex'),opN=card.querySelectorAll('.opt');
        var note=document.createElement('div');
        note.className='mw-skipnote';
        note.textContent='You skipped this question';
        if(exN)card.insertBefore(note,exN);
        else if(opN.length)card.insertBefore(note,opN[opN.length-1].nextSibling);
      }
      var row=card.querySelector('.qn-row');
      if(row){
        var qns=row.querySelectorAll('.qn'),first=qns[0];
        if(first&&!first.getAttribute('data-mw')){
          first.setAttribute('data-mw','1');
          var sel=first.querySelector('select'),segs=first.textContent.split('·'),id='',num='';
          for(var i=0;i<segs.length;i++){
            var s=segs[i].replace(/^\s+|\s+$/g,'');
            if(!s)continue;
            var nm=/^Question\s+(\d+)/i.exec(s);
            if(nm)num=nm[1];
            else if(!/^Section/i.test(s)&&!id&&s.length<24)id=s;
          }
          first.textContent='Q'+(id?' MCQID: '+id:(num?' '+num:''));
          if(sel)row.appendChild(sel);
          if(qns[1])qns[1].parentNode.removeChild(qns[1]);
        }
      }
    }
    var rp=document.getElementById('rp'),rnB=document.getElementById('rn'),bk=document.getElementById('bk'),rl=document.getElementById('rl');
    if(rp&&rp.textContent!=='PREV')rp.textContent='PREV';
    if(rnB&&rnB.textContent!=='NEXT')rnB.textContent='NEXT';
    if(bk&&bk.textContent!=='DONE')bk.textContent='DONE';
    if(rl&&rl.textContent!=='☰')rl.textContent='☰';
    var pl=document.getElementById('pl');
    if(pl&&!pl.getAttribute('aria-label'))pl.setAttribute('aria-label','All questions');
    /* Same question re-rendered (answer / mark / guess tap): restore the exact scroll position
       so options below a tall image stay on screen. A different question: start at the top. */
    var q=r.querySelector('.qn'),t=q?q.textContent:'';
    if(t!==mwLast){mwLast=t;mwScroll=0;if(main)main.scrollTop=0;r.scrollTop=0;window.scrollTo(0,0)}
    else if(main&&mwScroll>0)main.scrollTop=mwScroll;
    mwSubjUI(r);
    fitOpts(r);
  }
  function go(){
    var r=document.getElementById('root');
    if(!r)return;
    r.addEventListener('scroll',function(ev){var el=ev.target;if(el&&el.tagName==='MAIN')mwScroll=el.scrollTop},true);
    new MutationObserver(fix).observe(r,{childList:true});
    /* the reader's font slider rewrites the #hr-zoom style element — re-fit the option text */
    var zs=document.getElementById('hr-zoom');
    if(zs)new MutationObserver(function(){fitOpts(r)}).observe(zs,{childList:true,characterData:true,subtree:true});
    fix();
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',go);else go();
}
